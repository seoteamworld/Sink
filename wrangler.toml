name = "sink"
compatibility_date = "2024-04-03"          # 固定一个已知稳定的日期（勿晚于今天）
compatibility_flags = ["nodejs_compat"]    # 关键：开启 Node 兼容层

# 让 Pages 识别静态产物目录（按你的构建产物调整）
# 如果你用的是 Nuxt/Nitro 的 cloudflare-pages 预设且输出到 dist，请写：
pages_build_output_dir = "./dist"

# （可选）如果你的打包结果里确实有这个入口，可显式指定
# main = "dist/_worker.js/index.js"
